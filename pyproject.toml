[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expedientes-pjud"
version = "0.1.0"
description = "Consulta y seguimiento de expedientes del Poder Judicial (reemplazo paralelo del bot Rocketbot)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "tenacity>=9.0",
  "jinja2>=3.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
expedientes = "expedientes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/expedientes"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI usa Depends() en los defaults por diseño.
"src/expedientes/api.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
